<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

    <!-- Header -->

    <header>

        <h1>My To-Do List</h1>

        <button id="themeBtn">
            🌙 Dark Mode
        </button>

    </header>



    <!-- Main Container -->

    <div class="container">

        <!-- Input Section -->

        <div class="task-form">

            <h2>Add New Task</h2>

            <input
                type="text"
                id="taskInput"
                placeholder="Enter Task Name">

            <select id="category">

                <option value="">Select Category</option>

                <option>Study</option>

                <option>Work</option>

                <option>Personal</option>

                <option>Shopping</option>

                <option>Health</option>

            </select>

            <select id="priority">

                <option value="">Priority</option>

                <option>High</option>

                <option>Medium</option>

                <option>Low</option>

            </select>

            <input
                type="date"
                id="dueDate">

            <button id="addTask">
                Add Task
            </button>

        </div>



        <!-- Search -->

        <div class="search-section">

            <input
                type="text"
                id="searchTask"
                placeholder="Search Task">

        </div>



        <!-- Filter -->

        <div class="filter-section">

            <select id="filterStatus">

                <option value="All">
                    All Tasks
                </option>

                <option value="Completed">
                    Completed
                </option>

                <option value="Pending">
                    Pending
                </option>

            </select>

        </div>



        <!-- Summary -->

        <div class="summary">

            <div class="card">

                <h3>Total</h3>

                <p id="totalTask">0</p>

            </div>

            <div class="card">

                <h3>Completed</h3>

                <p id="completedTask">0</p>

            </div>

            <div class="card">

                <h3>Pending</h3>

                <p id="pendingTask">0</p>

            </div>

        </div>

                <!-- Task List -->

        <div class="task-list">

            <table>

                <thead>

                    <tr>

                        <th>Task</th>

                        <th>Category</th>

                        <th>Priority</th>

                        <th>Due Date</th>

                        <th>Status</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody id="taskTable">

                    <!-- Tasks JavaScript se yaha aayenge -->

                </tbody>

            </table>

        </div>

    </div>



    <!-- Footer -->

    <footer>

        <p>

            © 2026 My To-Do List App | Built using HTML, CSS & JavaScript

        </p>

    </footer>



    <!-- JavaScript -->

    <script src="script.js"></script>

</body>

</html>
